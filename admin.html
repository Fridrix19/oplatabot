<!doctype html><meta charset="utf-8"><title>Platas Admin</title><style>body{font:14px Arial;background:#0f1117;color:#eee;max-width:1100px;margin:0 auto;padding:30px}header{font-size:22px;padding:20px 0;border-bottom:1px solid #333}.card,.panel{background:#181b24;border:1px solid #292e3b;border-radius:14px;padding:20px;margin:18px 0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.num{font-size:28px;color:#7c9cff;margin-top:8px}input,button{padding:11px;border-radius:8px;margin:4px;background:#11151e;color:#fff;border:1px solid #343a4a}button{background:#526dff;border:0}th,td{padding:12px;border-bottom:1px solid #333;text-align:left}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}}</style><h1>Админ-панель</h1><input id="token" placeholder="ADMIN_TOKEN" type="password"><button onclick="load()">Войти</button><h2>Товары</h2><div><input id="name" placeholder="Название"><input id="cat" placeholder="Категория"><input id="price" type="number" placeholder="Цена"><input id="image" placeholder="Изображение"><button onclick="add()">Добавить</button></div><table id="products"></table><h2>Заказы</h2><table id="orders"></table><script>let H=()=>({Authorization:'Bearer '+token.value,'Content-Type':'application/json'});async function load(){let p=await fetch('/api/admin/products',{headers:H()}).then(r=>r.json());products.innerHTML='<tr><th>Товар</th><th>Категория</th><th>Цена</th><th>Свободно</th></tr>'+p.map(x=>`<tr><td>${x.name}</td><td>${x.category}</td><td>${x.price}</td><td>${x.available}</td></tr>`).join('');let o=await fetch('/api/admin/orders',{headers:H()}).then(r=>r.json());orders.innerHTML='<tr><th>Номер</th><th>Сумма</th><th>Статус</th></tr>'+o.map(x=>`<tr><td>${x.id}</td><td>${x.amount}</td><td>${x.status}</td></tr>`).join('')}async function add(){await fetch('/api/admin/products',{method:'POST',headers:H(),body:JSON.stringify({name:name.value,category:cat.value,price:+price.value,image:image.value})});load()}</script>
