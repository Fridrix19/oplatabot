<!doctype html><meta charset="utf-8"><style>body{margin:0;font:14px Arial;background:#0d1117;color:#eee;display:flex}aside{width:220px;background:#161b22;min-height:100vh;padding:24px}main{padding:28px;flex:1}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.card{background:#1c2330;border:1px solid #303947;border-radius:14px;overflow:hidden}.card img{width:100%;height:130px;object-fit:cover}.info{padding:15px}.price{color:#7c9cff;font-size:20px}input,button{padding:10px;margin:4px;border-radius:8px;border:1px solid #394150;background:#111;color:#fff}button{background:#526dff;border:0}nav div{padding:12px 0;color:#aab2c0}section{display:none}section.active{display:block}</style><aside><h2>PLATAS</h2><nav><div onclick="tab('products')">Товары</div><div onclick="tab('orders')">Заказы</div><div onclick="tab('codes')">Коды</div></nav></aside><main><input id="token" placeholder="ADMIN_TOKEN" type="password"><button onclick="load()">Войти</button><section id="products" class="active"><h1>Товары по категориям</h1><p id="feedback" role="status"></p><div id="grid" class="cards"></div></section><section id="orders"><h1>Заказы</h1><div id="olist"></div></section><section id="codes"><h1>Коды</h1><p>Загрузка кодов доступна через API администратора.</p></section></main><script>const H=()=>({Authorization:'Bearer '+token.value,'Content-Type':'application/json'});function tab(x){document.querySelectorAll('section').forEach(s=>s.classList.remove('active'));document.getElementById(x).classList.add('active')}async function load(){let p=await fetch('/api/admin/products',{headers:H()}).then(r=>r.json());grid.innerHTML=p.map(x=>`<div class=card>${x.image?`<img src="${x.image}">`:''}<div class=info><b>${x.name}</b><p>${x.category}</p><div class=price>${x.price} ₽</div><p>Остаток: <input id="s_${x.id}" type="number" min="0" step="1" value="${x.stock??x.available}" style="width:70px"><button onclick="saveStock('${x.id}')">Сохранить</button></p><button onclick="status('${x.id}','${x.status==='disabled'?'available':'disabled'}')">${x.status==='disabled'?'Включить':'Отключить'}</button></div></div>`).join('');let o=await fetch('/api/admin/orders',{headers:H()}).then(r=>r.json());olist.innerHTML=o.map(x=>`<div class=card><div class=info><b>${x.id}</b><p>Товар: ${x.productId}</p><p>Сумма: ${x.amount} ₽</p><p>Статус: ${x.status}</p></div></div>`).join('')}async function saveStock(id){const input=document.getElementById('s_'+id),stock=Number(input.value);if(input.value===''||!Number.isSafeInteger(stock)||stock<0){feedback.textContent='Укажите целый остаток от 0';return;}try{const r=await fetch('/api/admin/products/'+id,{method:'PATCH',headers:H(),body:JSON.stringify({stock})});if(!r.ok){const e=await r.json();throw new Error(e.error||'Ошибка сохранения');}localStorage.setItem('stock-updated',String(Date.now()));await load();feedback.textContent='Сохранено. Наличие на сайте обновляется автоматически.';}catch(e){feedback.textContent=e.message;}}async function addStock(id){await fetch('/api/admin/stock',{method:'POST',headers:H(),body:JSON.stringify({productId:id,quantity:+stock.value})});load()}async function status(id,s){await fetch('/api/admin/products/'+id,{method:'PATCH',headers:H(),body:JSON.stringify({status:s})});load()}</script>
