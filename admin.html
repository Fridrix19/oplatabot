<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}body{margin:0;font:14px system-ui;background:#0d1117;color:#eef2ff}aside{width:240px;background:#151b26;min-height:100vh;padding:24px;position:fixed}main{margin-left:240px;padding:28px;max-width:1400px}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}.card{background:#182130;border:1px solid #2b3850;border-radius:18px;overflow:hidden;box-shadow:0 8px 25px #0002}.card img{width:100%;height:150px;object-fit:cover}.info{padding:18px}.price{color:#9eb3ff;font-size:20px;font-weight:700}input,button{padding:11px 13px;border-radius:10px;border:1px solid #35445e;background:#101722;color:#fff}button{background:#536dff;border:0;cursor:pointer}nav div{padding:13px 15px;margin:6px 0;color:#aab7cc;border-radius:10px;cursor:pointer}nav div:hover{background:#25314a;color:#fff}section{display:none}section.active{display:block}.bottom-nav{display:none}@media(max-width:700px){aside{position:static;width:100%;min-height:0;padding:14px 16px}aside h2{margin:0 0 10px}aside nav{display:none}main{margin:0;padding:16px 14px 90px}.cards{grid-template-columns:1fr;gap:14px}.card img{height:170px}.bottom-nav{position:fixed;display:flex;bottom:0;left:0;right:0;height:70px;background:#151b26;border-top:1px solid #2b3850;z-index:10;padding:6px;gap:6px}.bottom-nav button{flex:1;background:transparent;color:#aab7cc;font-size:12px}.bottom-nav button:active{background:#25314a;color:#fff}}
</style><aside><h2>PLATAS</h2><nav><div onclick="tab('products')">🛍️ Каталог</div><div onclick="tab('orders')">📦 Заказы</div><div onclick="tab('codes')">🔑 Коды</div></nav></aside><main><div><input id="token" placeholder="ADMIN_TOKEN" type="password"><button onclick="load()">Войти</button></div><section id="products" class="active"><h1>Каталог товаров</h1><p id="feedback"></p><div id="grid" class="cards"></div></section><section id="orders"><h1>Заказы</h1><div id="olist"></div></section><section id="codes"><h1>Коды</h1><p>Загрузка кодов доступна через API администратора.</p></section></main><script>const H=()=>({Authorization:'Bearer '+token.value,'Content-Type':'application/json'});function tab(x){document.querySelectorAll('section').forEach(s=>s.classList.remove('active'));document.getElementById(x).classList.add('active')}async function load(){let p=await fetch('/api/admin/products',{headers:H()}).then(r=>r.json());grid.innerHTML=p.map(x=>`<div class=card>${x.image?`<img src="${x.image}">`:''}<div class=info><b>${x.name}</b><p>${x.category}</p><div class=price><input id="p_${x.id}" type="number" step="0.01" min="0" value="${x.price}"> ₽</div><p>Остаток: <input id="s_${x.id}" type="number" min="0" step="1" value="${x.stock??x.available}" style="width:80px"><button onclick="saveStock('${x.id}')">Сохранить</button></p><button onclick="status('${x.id}','${x.status==='disabled'?'available':'disabled'}')">${x.status==='disabled'?'Включить':'Отключить'}</button></div></div>`).join('');let o=await fetch('/api/admin/orders',{headers:H()}).then(r=>r.json());olist.innerHTML=o.map(x=>`<div class=card><div class=info><b>${x.id}</b><p>${x.productId}</p><p>${x.amount} ₽ · ${x.status}</p></div></div>`).join('')}async function saveStock(id){const stock=Number(document.getElementById('s_'+id).value);const price=Number(document.getElementById('p_'+id).value);if(!Number.isSafeInteger(stock)||stock<0){feedback.textContent='Укажите целый остаток от 0';return}await fetch('/api/admin/products/'+id,{method:'PATCH',headers:H(),body:JSON.stringify({stock,price})});await load();feedback.textContent='Сохранено'}async function status(id,s){await fetch('/api/admin/products/'+id,{method:'PATCH',headers:H(),body:JSON.stringify({status:s})});load()}</script><script src="admin-orders.js"></script><div class="bottom-nav"><button onclick="tab('products')">🛍️<br>Каталог</button><button onclick="tab('orders')">📦<br>Заказы</button><button onclick="tab('codes')">🔑<br>Коды</button></div>
