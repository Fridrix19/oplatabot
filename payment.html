<!doctype html><meta charset="utf-8"><title>Оплата заказа</title><style>body{font:18px Arial;background:#10131b;color:#fff;text-align:center;padding:80px}main{max-width:420px;margin:auto;background:#1b2030;padding:32px;border-radius:18px}button{padding:14px 22px;border:0;border-radius:10px;margin:10px;cursor:pointer;background:#526dff;color:#fff;font-size:16px}.cancel{background:#444}</style><main><h2>Тестовая оплата</h2><p>Это безопасная имитация платёжной страницы.</p><button onclick="pay()">Успешно оплатить</button><button class="cancel" onclick="history.back()">Отменить</button><p id="r"></p></main><script>async function pay(){let id=location.pathname.split('/').pop();let x=await fetch('/api/payments/'+id+'/demo',{method:'POST'}).then(r=>r.json());r.textContent=x.code?'Код выдан: '+x.code:'Оплата обработана';}</script>
