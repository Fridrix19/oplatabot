<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Тестовая оплата</title><style>body{font:16px system-ui;background:#10131b;color:#fff;margin:0;padding:24px}main{max-width:440px;margin:10vh auto;background:#1b2030;padding:28px;border-radius:18px}button,a{display:block;box-sizing:border-box;width:100%;padding:14px;border:0;border-radius:10px;margin:12px 0;background:#526dff;color:white;text-align:center;font:inherit}button:disabled{opacity:.5}p{line-height:1.5;overflow-wrap:anywhere}</style><main><h1>Тестовая оплата</h1><p>Деньги не списываются. Товар выдаёт администратор после подтверждения.</p><button id="pay">Успешно оплатить</button><p id="result" role="status"></p><a href="/?page=purchases">Мои покупки</a></main><script>
const path=location.pathname,token=new URLSearchParams(location.search).get('token');
const button=document.getElementById('pay'),result=document.getElementById('result');
function show(status){button.disabled=status!=='awaiting_payment';result.textContent=status==='paid'?'Оплата подтверждена. Ожидайте ручную выдачу в боте и разделе «Мои покупки».':status==='delivered'?'Заказ выполнен. Результат доступен в Telegram.':status==='cancelled'||status==='expired'?'Время оплаты истекло. Заказ отменён.':'Заказ ожидает оплаты.';}
button.onclick=async()=>{button.disabled=true;try{const r=await fetch(path+'/demo?token='+encodeURIComponent(token),{method:'POST'}),data=await r.json();if(!r.ok)throw new Error(data.error);show(data.status);}catch(e){result.textContent=e.message;button.disabled=false;}};
fetch(path+'/status?token='+encodeURIComponent(token)).then(async r=>{const data=await r.json();if(!r.ok)throw new Error(data.error);show(data.status)}).catch(e=>{button.disabled=true;result.textContent=e.message;});
</script></html>
